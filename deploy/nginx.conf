# Site web Tchopi : site nginx de l'hôte (installé par deploy/server.sh) ; certbot y ajoute HTTPS et la redirection
# HTTP → HTTPS. www.<domaine> renvoie vers <domaine>. Le conteneur n'écoute que sur 127.0.0.1:3010.
server {
  server_name www.__DOMAIN__;
  server_tokens off;
  return 301 https://__DOMAIN__$request_uri;
  listen 80;
  listen [::]:80;
}

server {
  server_name __DOMAIN__;
  server_tokens off;
  client_max_body_size 4m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

  # Fichiers versionnés de Next.js : cache long.
  location /_next/static/ {
    proxy_pass http://127.0.0.1:3010;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  listen 80;
  listen [::]:80;
}
